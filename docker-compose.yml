services:
  mariadb:
    image: mariadb:latest
    container_name: list-manager-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_USER: user
      MARIADB_PASSWORD: password
      MARIADB_DATABASE: list_manager_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - list-manager-network

volumes:
  mariadb_data:
    driver: local

networks:
  list-manager-network:
    driver: bridge
